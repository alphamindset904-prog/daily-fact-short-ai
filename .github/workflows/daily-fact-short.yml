
name: Daily Fact Short

on:
  workflow_dispatch:

jobs:
  preparation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installer les bibliotheques
        run: pip install -r requirements.txt

      - name: Creer la video
        run: python main.py

      - name: Recuperer la video
        uses: actions/upload-artifact@v4
        with:
          name: daily-fact-short-video
          path: videos/daily-fact-short.mp4
