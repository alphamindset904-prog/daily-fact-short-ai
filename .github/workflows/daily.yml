name: Video du jour

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme de l'histoire (facultatif)"
        required: false
      privacy:
        description: "Visibilite sur YouTube"
        type: choice
        default: public
        options: [public, unlisted, private]

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Outils systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libatk-bridge2.0-0t64 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2t64 libpango-1.0-0 libcairo2

      - name: Installer les dependances
        run: |
          npm ci --no-audit --no-fund
          pip install -r requirements.txt

      - name: 1/5 Ecrire l'histoire
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_THEME: ${{ github.event.inputs.theme }}
        run: python tools/generate_story.py

      - name: 2/5 Voix off
        run: python tools/make_voice.py

      - name: 3/5 Animation 3D
        run: |
          npx remotion render src/index.jsx Story out/silent.mp4 \
            --gl=swangle --concurrency=4 --image-format=jpeg --jpeg-quality=90 --crf=18

      - name: 4/5 Assemblage
        run: python tools/mux.py

      - uses: actions/upload-artifact@v4
        with:
          name: video-du-jour
          path: out/final.mp4
          retention-days: 14

      - name: 5/5 Publier sur YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: python tools/upload_youtube.py

      - name: Memoriser l'histoire
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Histoire publiee" && git push)
